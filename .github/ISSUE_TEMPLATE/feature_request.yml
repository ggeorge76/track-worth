name: Feature request
description: Suggest an idea
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: principles
    attributes:
      label: Fit with project principles (SOUL.md)
      options:
        - label: Works with manual entry only (no bank connections or scraping)
        - label: Keeps all user data in the user's own Google Drive
