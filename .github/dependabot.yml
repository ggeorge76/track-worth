version: 2
updates:
  - package-ecosystem: bun
    directory: /
    # Updates go through dev (CI required) and reach main with a release.
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint doesn't support TypeScript 7 yet
      # (typescript-eslint/typescript-eslint#10940). Revisit when it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      tauri-js:
        patterns: ['@tauri-apps/*']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-dependencies:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      tauri-rust:
        patterns: ['tauri', 'tauri-*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
