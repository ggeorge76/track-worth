# Release flow (ADR-0010, ADR-0007, ADR-0008):
#   Conventional Commits on main -> release-please keeps a release PR open.
#   Merging that PR tags vX.Y.Z and creates the GitHub Release. Then this workflow builds the
#   desktop installers for macOS, Windows and Linux, signs the update bundles, and uploads
#   everything plus `latest.json` to that release. Installed apps read `latest.json` from the
#   latest release and offer the update; it installs only after the user confirms.
name: Release

on:
  push:
    branches: [main]
  # Rebuild the Android files for an existing release (e.g. one cut before the Android job
  # existed, or after a failed upload). Doesn't run release-please or the desktop builds.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build Android for (e.g. v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  desktop:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # upload release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-targets: ''
          - platform: ubuntu-24.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs update bundles so installed apps can verify them (ADR-0007).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled into the binary by src-tauri/build.rs (ADR-0004).
          TRACKWORTH_GOOGLE_CLIENT_ID: ${{ secrets.TRACKWORTH_GOOGLE_CLIENT_ID }}
          TRACKWORTH_GOOGLE_CLIENT_SECRET: ${{ secrets.TRACKWORTH_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  # Android (ADR-0009, ADR-0019): a signed app bundle for Google Play and a signed APK to install
  # directly, both signed with the Play upload key (docs/setup/android.md) and attached to the
  # release.
  android:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write # upload release assets
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      NDK_VERSION: 29.0.14206865
    steps:
      - name: Check the upload key is configured
        env:
          KEYSTORE: ${{ secrets.TRACKWORTH_UPLOAD_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.TRACKWORTH_UPLOAD_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Set TRACKWORTH_UPLOAD_KEYSTORE_BASE64 and TRACKWORTH_UPLOAD_STORE_PASSWORD (docs/setup/android.md)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK packages
        run: |
          sdk="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null
          "$sdk" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.TRACKWORTH_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "TRACKWORTH_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build signed AAB and APK
        env:
          TRACKWORTH_UPLOAD_STORE_PASSWORD: ${{ secrets.TRACKWORTH_UPLOAD_STORE_PASSWORD }}
        run: bun run tauri android build --aab --apk
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          out=src-tauri/gen/android/app/build/outputs
          cp "$out/bundle/universalRelease/app-universal-release.aab" "TrackWorth_${version}_android.aab"
          cp "$out/apk/universal/release/app-universal-release.apk" "TrackWorth_${version}_android.apk"
          gh release upload "$TAG" "TrackWorth_${version}_android.aab" "TrackWorth_${version}_android.apk" --clobber
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
